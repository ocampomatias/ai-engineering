# API + Redis 8 + Phoenix, todo local:  docker compose up --build
# La API toma las API keys del .env; REDIS_URL y Phoenix apuntan a los contenedores.
services:
  redis:
    image: redis:8
    ports: ["6379:6379"]
  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]
  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    ports: ["8000:8000"]
    depends_on: [redis, phoenix]
